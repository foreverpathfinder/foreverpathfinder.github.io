<!doctype html>
<!-- sorgenti di banner.png (600×160) e kofi.png (210×160) per CurseForge: node src/tools/banner.js -->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&display=block" rel="stylesheet">
<style>
html,body{margin:0;background:transparent}
.card{position:relative;overflow:hidden;border-radius:10px;box-sizing:border-box;
  background:radial-gradient(ellipse 70% 130% at 18% 45%, #16304d 0%, #0b1828 50%, #050b14 100%);
  box-shadow:inset 0 0 0 1px #5a4a22}
.card svg.sky{position:absolute;inset:0}
.gold{color:#e8b84a;text-shadow:0 2px 0 #5a3e0c, 0 3px 4px rgba(0,0,0,.9)}
#banner{width:600px;height:160px;display:flex;align-items:center;gap:26px;padding-left:22px}
#banner .logo{position:relative;width:118px;height:118px;flex:none;border-radius:12px;overflow:hidden;box-shadow:0 0 0 1px #050b14, 0 6px 18px rgba(0,0,0,.7)}
#banner .logo img{width:100%;height:100%;display:block}
#banner .word{position:relative;font-family:Cinzel,serif;line-height:1}
#banner .small{font-size:21px;font-weight:600;letter-spacing:.9em;margin:0 0 8px 4px;color:#c9a456;text-shadow:0 2px 3px #000}
#banner .big{font-size:56px;font-weight:800;letter-spacing:.06em}
#banner .rule{display:flex;align-items:center;gap:10px;margin:10px 0 0 4px;color:#93a6be;font:600 13px/1 Cinzel,serif;letter-spacing:.32em}
#banner .rule:before,#banner .rule:after{content:"";height:1px;width:34px;background:linear-gradient(90deg,transparent,#c9a456)}
#banner .rule:after{background:linear-gradient(90deg,#c9a456,transparent)}
#kofi{width:210px;height:160px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:Cinzel,serif;text-align:center}
#kofi .cup{position:relative;width:64px;height:52px;margin-bottom:12px}
#kofi .small{font-size:13px;font-weight:600;letter-spacing:.42em;padding-left:.42em;color:#c9a456;text-shadow:0 2px 3px #000}
#kofi .big{font-size:38px;font-weight:800;letter-spacing:.04em;margin-top:6px}
</style></head><body>
<div id="banner" class="card">
 <svg class="sky" viewBox="0 0 600 160" preserveAspectRatio="none"></svg>
 <div class="logo"><img src="logo-400.png" alt=""></div>
 <div class="word"><div class="small">FOREVER</div><div class="big gold">PATHFINDER</div><div class="rule">1 – 60 · IN GAME</div></div>
</div>
<div style="height:20px"></div>
<div id="kofi" class="card">
 <svg class="sky" viewBox="0 0 210 160" preserveAspectRatio="none"></svg>
 <svg class="cup" viewBox="0 0 64 52">
  <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff2c4"/><stop offset=".45" stop-color="#e8b84a"/><stop offset="1" stop-color="#a8781f"/></linearGradient></defs>
  <path d="M20 4c-3 4 3 6 0 10M30 2c-3 4 3 6 0 10M40 4c-3 4 3 6 0 10" fill="none" stroke="#c9a456" stroke-width="2.4" stroke-linecap="round" opacity=".8"/>
  <path d="M8 20h40v12c0 10-8 18-18 18h-4c-10 0-18-8-18-18z" fill="url(#g)"/>
  <path d="M48 24h4a8 8 0 0 1 0 16h-6" fill="none" stroke="url(#g)" stroke-width="5"/>
 </svg>
 <div class="small">SUPPORT ME</div>
 <div class="big gold">Ko-fi</div>
</div>
<script>
// cielo stellato come lo sfondo del logo: puntini fermi (seme fisso), qualcuno più luminoso
for (const svg of document.querySelectorAll('svg.sky')) {
  const [, , w, h] = svg.getAttribute('viewBox').split(' ').map(Number);
  let s = w * 7 + 3; const r = () => (s = (s * 16807) % 2147483647) / 2147483647;
  let out = '';
  for (let i = 0; i < w * h / 900; i++) { const big = r() < .12;
    out += `<circle cx="${(r() * w).toFixed(1)}" cy="${(r() * h).toFixed(1)}" r="${big ? 1.3 : .7}" fill="${big ? '#e7eef7' : '#93a6be'}" opacity="${(.35 + r() * .6).toFixed(2)}"/>`; }
  svg.innerHTML = out + `<rect width="${w}" height="${h}" fill="url(#v${w})"/>` +
    `<defs><radialGradient id="v${w}" cx="50%" cy="50%" r="75%"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".7"/></radialGradient></defs>`;
}
</script>
</body></html>
